# Supabase local/project configuration for FreightFlow.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "freightflow"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# 50 MiB default upload limit; individual buckets tighten this further.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "freightflow://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# External OAuth providers are disabled by default; enable per project as needed.
[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false
